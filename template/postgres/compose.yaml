# Development stack for `make up`. DEVELOPMENT ONLY: the database credentials
# and the mail sink below are published, throwaway settings. Never reuse them
# anywhere that holds real data.
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    # Loopback only, so native runs and `make test` can reach it. Set
    # POSTGRES_PORT when 5432 is taken on your machine.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

  server:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      BASE_URL: http://localhost:8080
      COOKIE_SECURE: "false"
      # The service name resolves on the compose network; sslmode=disable is
      # acceptable only because the traffic never leaves this machine.
      DATABASE_URL: postgres://app:app@postgres:5432/app?sslmode=disable
      # Local mail sink: deliberately unencrypted and unauthenticated.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS: none
      EMAIL_FROM: dev@example.com

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  postgres-data:
