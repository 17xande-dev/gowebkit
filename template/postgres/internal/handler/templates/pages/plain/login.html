{{define "content"}}
<section class="panel">
  <h1>Sign in</h1>
  {{with .Message}}<p role="alert">{{.}}</p>{{end}}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{.CSRF}}">
    <input type="hidden" name="next" value="{{.Next}}">
    <p><label>Email <input type="email" name="email" autocomplete="username" value="{{.Email}}" required{{if not .Email}} autofocus{{end}}></label></p>
    <p><label>Password <input type="password" name="password" autocomplete="current-password" required{{if .Email}} autofocus{{end}}></label></p>
    <button type="submit">Sign in</button>
  </form>
</section>
{{end}}
