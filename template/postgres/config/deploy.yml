service: myapp
image: OWNER/myapp

servers:
  web:
    hosts:
      - server.example
    options:
      memory: 512m

proxy:
  host: myapp.example.com
  app_port: 8080
  # With a private tunnel terminating HTTPS, use ssl: false and run.publish: false.
  ssl: true
  run:
    version: v0.10.2
    publish: true
  healthcheck:
    path: /healthz

registry:
  server: ghcr.io
  username: OWNER
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

env:
  clear:
    BASE_URL: https://myapp.example.com
    COOKIE_SECURE: "true"
    # Behind Kamal Proxy the socket peer is always the proxy, so "remote" would
    # put every client in one rate-limit bucket. With proxy.ssl: true the proxy
    # rebuilds X-Forwarded-For from the real client address, which is what
    # "forwarded" requires. If you set proxy.ssl: false (a tunnel or CDN in
    # front), the proxy appends instead: switch to "cloudflare" when Cloudflare
    # is the sole ingress, otherwise use "remote" and accept the shared bucket.
    CLIENT_IP_SOURCE: forwarded
    PASSWORD_CONCURRENCY: "2"
  secret:
    # The full connection URL, built in .env.production from the same password
    # the accessory below receives. See docs/deploy.md.
    - DATABASE_URL

# The database runs as a Kamal accessory: a container on the same host, kept
# apart from app deploys. `kamal setup` boots accessories before the app; after
# that `kamal deploy` never restarts it. Pin the exact image tag and upgrade
# deliberately: a new major version needs a dump and restore (docs/database.md).
accessories:
  postgres:
    image: postgres:18.6-alpine
    host: server.example
    # No `port:` is published: only containers on the Kamal Docker network
    # reach the database, under the name myapp-postgres.
    env:
      clear:
        POSTGRES_USER: app
        POSTGRES_DB: app
      secret:
        - POSTGRES_PASSWORD
    volumes:
      - myapp-postgres-data:/var/lib/postgresql
    options:
      memory: 1g
      health-cmd: pg_isready -h 127.0.0.1 -U app -d app
      health-interval: 5s
      health-timeout: 3s
      health-retries: 12
