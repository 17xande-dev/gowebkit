name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      # The database below is used as is, so `make test` does not start the
      # Compose one, and a missing database fails the run instead of skipping.
      TEST_DATABASE_URL: postgres://app:app@127.0.0.1:5432/app?sslmode=disable
      TEST_REQUIRE_DB: "1"
    services:
      postgres:
        # Keep this tag equal to the one in config/deploy.yml.
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U app -d app"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # fmt-check, vet, test and vulncheck, with the generated-code check first.
      - run: make gate
