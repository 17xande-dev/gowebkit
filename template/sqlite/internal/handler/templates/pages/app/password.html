{{define "content"}}
<section class="card">
  <h1>Change password</h1>
  {{if .MustChange}}<p role="status">You must choose a new password before you continue.</p>{{end}}
  {{with .Message}}<p role="alert">{{.}}</p>{{end}}
  <form method="post" action="/account/password">
    <input type="hidden" name="csrf_token" value="{{.CSRF}}">
    <p><label>Current password <input type="password" name="current" autocomplete="current-password" required></label></p>
    <p><label>New password <input type="password" name="new" autocomplete="new-password" minlength="12" required></label></p>
    <p><label>Confirm new password <input type="password" name="confirm" autocomplete="new-password" minlength="12" required></label></p>
    <button type="submit">Change password</button>
  </form>
</section>
{{end}}
