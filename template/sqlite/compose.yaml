services:
  server:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      BASE_URL: http://localhost:8080
      COOKIE_SECURE: "false"
      # Local mail sink: deliberately unencrypted and unauthenticated.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS: none
      EMAIL_FROM: dev@example.com
    volumes:
      - myapp-data:/data

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  myapp-data:
