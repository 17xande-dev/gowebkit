name: Latest kit modules

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  latest:
    runs-on: ubuntu-latest
    env:
      TEST_REQUIRE_DB: "1"
    strategy:
      fail-fast: false
      matrix:
        variant: [sqlite, postgres]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: template/${{ matrix.variant }}/go.mod
          cache-dependency-path: template/${{ matrix.variant }}/go.sum
      - run: |
          go run ./gonewtest -root .. -rev "$GITHUB_SHA" \
            -template "template/${{ matrix.variant }}" -gonew-version latest \
            -- sh -eu -c '
              go get github.com/17xande-dev/websec@latest \
                github.com/17xande-dev/ratelimit@latest \
                github.com/17xande-dev/password@latest \
                github.com/17xande-dev/sqlitekit@latest \
                github.com/17xande-dev/mailer@latest
              go mod tidy
              make gate
            '
        working-directory: tools
